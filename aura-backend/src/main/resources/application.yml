# Aura Backend 配置文件

server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: aura-backend
  
  # ==================== 数据源配置 ====================
  datasource:
    url: jdbc:postgresql://localhost:5432/aura_db
    username: aura
    password: ${DB_PASSWORD:aura123}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  
  # ==================== JPA 配置 ====================
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  
  # ==================== Redis 配置 ====================
  data:
    redis:
      host: 172.22.222.129
      port: 6379
      timeout: 10000
  
  # ==================== Spring AI 配置 ====================
  ai:
    openai:
      api-key: sk-ws-H.EERMLMI.3w8u.MEUCIQCY50j0xdlem-V5uODN1wIF5Q2QKeTJeSjZzkc5QGeuOAIgE6i_p7MRLaJ5SKI1R9Q0LSGObCYTSI7mi6yPIfj2pmw
      base-url: https://dashscope.aliyuncs.com/compatible-mode
      chat:
        options:
          model: qwen3-max
          temperature: 0.65          # 略低于0.7，提升JSON输出的稳定性，同时保留创意性
          max-tokens: 2500           # 增加到2500，允许更详细的穿搭描述
      embedding:
        options:
          model: text-embedding-v3
    
    # Milvus 向量存储配置
    vectorstore:
      milvus:
        host: localhost
        port: 19530
        collection-name: aesthetic_knowledge
        embedding-dimension: 1024
        initialize-schema: true

# ==================== Milvus 配置 ====================
milvus:
  host: localhost
  port: 19530
  collections:
    wardrobe: user_wardrobe
    knowledge: aesthetic_knowledge

# ==================== Aura 业务配置 ====================
aura:
  # JWT 配置
  jwt:
    secret: ${JWT_SECRET:VGhpcyBpcyBhIHZlcnkgc2VjdXJlIGp3dCBzZWNyZXQga2V5IGZvciBBdXJhIEJhY2tlbmQgc2VydmljZSAyMDI0}
    access-token-expiration: 3600000      # 1 hour in milliseconds
    refresh-token-expiration: 604800000   # 7 days in milliseconds
    token-prefix: "Bearer "
    header: "Authorization"
  
  # ReAct 引擎配置
  react:
    max-steps: 10
    timeout-seconds: 30
  
  # RAG 检索配置
  rag:
    recall-top-k: 100
    rerank-top-k: 10
    final-top-k: 5
  
  # 插件配置
  plugins:
    enabled:
      - ClothingAnalyzer
      - RAGSearch
      - WeatherPlugin

  # 多轮对话配置
  chat:
    max-history-rounds: 10          # 最大保留的历史对话轮数
    max-message-length: 500         # 单条消息最大字符数（用于上下文）
    session-expire-ms: 7200000      # 会话过期时间（2小时）

# ==================== 日志配置 ====================
logging:
  level:
    com.aura: ${LOG_LEVEL:DEBUG}
    org.springframework.ai: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# ==================== 管理端点 ====================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
